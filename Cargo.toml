[package]
name = "bagr-wasm"
version = "0.1.0"
edition = "2021"
description = "BagIt 0.97 reader/writer for the browser, ported from Library of Congress bagit-python."
license = "Apache-2.0"
repository = "https://github.com/emoporemilio/bagr-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
percent-encoding = "2"
async-trait = "0.1"
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "WritableStream",
  "WritableStreamDefaultWriter",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
